[project]
name = "herbatka-api"
version = "0.1.0"
description = "Herbatka API — tea tracking, households, and ratings"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "pydantic[email]>=2.13.4",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.isort]
# The local alembic/ directory makes ruff read the installed `alembic` package as
# first-party. It is not.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Alembic's template always imports sqlalchemy, whether or not a revision uses it.
"alembic/versions/*" = ["F401"]
