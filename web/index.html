<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells the browser both schemes are supported before a single line of CSS
         has loaded, so the canvas behind the app is already the right colour on
         the very first frame instead of being white for one paint. -->
    <meta name="color-scheme" content="light dark" />

    <!--
      Installed-app metadata. The web app manifest is generated by
      `vite-plugin-pwa` and its <link rel="manifest"> is injected at build time,
      so everything below is only the part a manifest cannot express.

      THE TWO THEME COLOURS. A manifest carries one `theme_color`; this app has
      two schemes. These metas are media-queried and take precedence over the
      manifest, so the Android status bar and the desktop title bar follow the
      operating system the same way the stylesheet does. The values are the two
      halves of `--color-neutral-900` in index.css — the nav bar, which is what
      the browser chrome is actually sitting against. Copied as literals because
      a <meta> cannot read a custom property; if the token moves, move these.

      KNOWN GAP: this follows the *OS* preference. Somebody who used the in-app
      toggle to override it gets browser chrome from the other scheme until they
      change the OS setting too. Fixing it means having ThemeProvider write these
      metas, which is a change to a file this work has no business touching.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1d18" />

    <!--
      iOS reads none of the manifest for "Add to Home Screen" — not the icons, not
      the name, not `display`. These four lines are the entire iOS install story,
      which is why the apple-touch-icon is a <link> here and not a manifest entry.
      Without it Safari screenshots the page and uses that as the icon.

      `status-bar-style` is `default`, not `black-translucent`. Translucent lets
      the page run under the notch, which needs `viewport-fit=cover` and
      `env(safe-area-inset-*)` padding throughout — and PLAN.md's M7 mobile
      layout pass has not happened, so the app has neither. `default` keeps the
      status bar as its own opaque strip and iOS colours it from `body`'s
      background, which index.css sets to `--color-neutral-950`.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="Herbatka" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Deprecated in favour of `mobile-web-app-capable`, and still the only one
         iOS reads. Both, until that stops being true. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Herbatka</title>
    <!--
      The only script in the document, and the only thing standing between a
      returning visitor and one frame of the wrong theme.

      `index.css` writes every colour as `light-dark(day, night)` and puts
      `color-scheme: light dark` on <html>, so somebody with *no* stored
      preference gets their operating system's choice from the stylesheet
      itself — correct on the first paint, no script involved. This handles the
      other case: somebody who explicitly chose the evening theme on a machine
      set to light. CSS cannot read localStorage, so without these six lines the
      page would paint daylight and then swap, which is the flash the brief
      asks us not to have.

      It is inline and synchronous on purpose. An external file, `defer`, or
      anything in the React tree all run after the first paint, which is the
      only moment this is here to fix. `ThemeProvider` reads back what this
      writes, so there is no second correction when React mounts.

      The key is duplicated from `THEME_STORAGE_KEY` in components/ui/theme.tsx
      because nothing can be imported here. If you rename it, rename it there.
    -->
    <script>
      ;(function () {
        try {
          var choice = localStorage.getItem('herbatka-theme')
          if (choice === 'light' || choice === 'dark') {
            document.documentElement.setAttribute('data-theme', choice)
          }
        } catch (error) {
          /* Site data blocked. The OS preference in CSS is a fine answer. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
